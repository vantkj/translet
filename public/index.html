<script>

const S1='Penerjemah ke Mandarin Tradisional Taiwan (國語). Input: Indonesia atau Hanzi (termasuk Hanzi sederhana/daratan, ubah ke gaya Taiwan). Pakai kosakata, istilah, dan tanda baca Taiwan (mis. 捷運, 軟體, 影片, 計程車, 「」), bukan daratan. Jangan tulis pinyin. Balas persis 2 baris, tanpa tambahan:\nHanzi\nArti Indonesia';

const S1A='Penerjemah ke Mandarin Tradisional Taiwan (國語). Input: Indonesia atau Hanzi (termasuk Hanzi sederhana/daratan, ubah ke gaya Taiwan). Pakai kosakata, istilah, dan tanda baca Taiwan (mis. 捷運, 軟體, 影片, 計程車, 「」), bukan daratan. Pinyin bernada dengan pelafalan standar Taiwan (mis. 垃圾 lèsè, 星期 xīngqí, 研究 yánjiù, 車 chē); pilih bacaan sesuai konteks untuk karakter berbunyi ganda. Balas persis 3 baris, tanpa tambahan:\nHanzi\nPinyin\nArti Indonesia';
const S2A='Jelaskan singkat dalam bahasa Indonesia untuk teks Mandarin Taiwan dari pengguna. Pinyin pakai pelafalan Taiwan (車 = chē). Format 3 bagian dipisah baris berisi ---: (1) satu baris per karakter/partikel penting (maks 6): 字 (pinyin) = arti. (2) satu contoh kalimat gaya Taiwan, 3 baris: Hanzi / Pinyin / arti. (3) satu kalimat catatan singkat (nuansa, penggunaan, atau tata bahasa), hanya jika berguna. Tanpa tambahan.';
const pm=()=>L.getItem('tr_pm')||'lib';
const TW={'車':'chē','垃圾':'lè sè','研究':'yán jiù','星期':'xīng qí','角色':'jué sè','說服':'shuì fú','危險':'wéi xiǎn','微笑':'wéi xiào','期待':'qí dài'};
function applyCr(){const o={...TW};for(const l of (L.getItem('tr_cr')||'').split('\n')){const i=l.indexOf('=');if(i>0){const k=l.slice(0,i).trim(),v=l.slice(i+1).trim();if(k&&v)o[k]=v}}try{pinyinPro.customPinyin(o)}catch(e){}}
applyCr();
const py=t=>{try{return pinyinPro.pinyin(t)}catch(e){return ''}};
const T={anthropic:{n:'Claude',m:'claude-haiku-5-5'},gemini:{n:'Gemini',m:'gemini-2.5-flash'},groq:{n:'Groq',m:'llama-3.3-70b-versatile',b:'https://api.groq.com/openai/v1'},openrouter:{n:'OpenRouter',m:'google/gemini-2.5-flash',b:'https://openrouter.ai/api/v1'},openai:{n:'OpenAI',m:'gpt-4o-mini',b:'https://api.openai.com/v1'},custom:{n:'Kustom (OpenAI-kompatibel)',m:'',b:''}};
const rid=()=>Math.random().toString(36).slice(2,8);
let slots=JSON.parse(L.getItem('tr_slots')||'null');
if(!slots){slots=[];for(const t of ['gemini','anthropic','openai']){const k=L.getItem('k_'+t)||(t==='anthropic'?L.getItem('tr_key'):'');if(k)slots.push({id:rid(),t,k,m:L.getItem('m_'+t)||T[t].m,b:t==='openai'?(L.getItem('tr_base')||T.openai.b):''})}}
const saveSlots=()=>L.setItem('tr_slots',JSON.stringify(slots));
const cool={};L.removeItem('tr_cool');
const nm=s=>{if(s.n)return s.n;const sm=slots.filter(x=>x.t===s.t);return sm.length>1?T[s.t].n+' '+(sm.indexOf(s)+1):T[s.t].n};const lbl=i=>(i+1)+'. '+nm(slots[i]);
async function call(s,system,text,max){
 const {t,k,m}=s,b0=(s.b||T[t].b||'').replace(/\/$/,'');
 let url,h={'content-type':'application/json'},b,pick;
 if(t==='anthropic'){url='https://api.anthropic.com/v1/messages';h['x-api-key']=k;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true';
  b={model:m,max_tokens:max,temperature:0,system,messages:[{role:'user',content:text}]};
  pick=d=>[d.content.map(c=>c.text||'').join(''),d.usage.input_tokens,d.usage.output_tokens,d.stop_reason==='max_tokens']}
 else if(t==='gemini'){url='https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent';h['x-goog-api-key']=k;
  b={systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text}]}],generationConfig:{temperature:0,maxOutputTokens:max}};
  const th=s.nt?null:/2\.5-flash/.test(m)?{thinkingBudget:0}:/gemini-3/.test(m)?{thinkingLevel:'low'}:null;
  if(th)b.generationConfig.thinkingConfig=th;
  if(!(th&&th.thinkingBudget===0))b.generationConfig.maxOutputTokens=max+800;
  pick=d=>[(d.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join(''),d.usageMetadata?.promptTokenCount||0,(d.usageMetadata?.candidatesTokenCount||0)+(d.usageMetadata?.thoughtsTokenCount||0),d.candidates?.[0]?.finishReason==='MAX_TOKENS']}
 else{url=b0+'/chat/completions';h.authorization='Bearer '+k;
  b={model:m,max_tokens:max,temperature:0,messages:[{role:'system',content:system},{role:'user',content:text}]};
  if(s.x){try{Object.assign(b,JSON.parse(s.x))}catch(e){}}
  if(t==='openrouter')b.reasoning=s.rt?{effort:'low',exclude:true}:{enabled:false};
  pick=d=>{const c=d.choices?.[0]?.message?.content;return [Array.isArray(c)?c.map(p=>p.text||'').join(''):(c||d.choices?.[0]?.text||''),d.usage?.prompt_tokens||0,d.usage?.completion_tokens||0,d.choices?.[0]?.finish_reason==='length']}}
 let r;try{r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify(b)})}catch(e){throw{st:0,msg:'tidak ada koneksi atau diblokir CORS'}}
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const msg=d.error?.message||d[0]?.error?.message||'HTTP '+r.status;
  if(t==='gemini'&&!s.nt&&/thinking/i.test(msg))return call({...s,nt:1},system,text,max);
  if(t==='openrouter'&&!s.rt&&/reasoning|mandatory/i.test(msg))return call({...s,rt:1},system,text,max);
  throw{st:r.status,msg}}
 const [raw,i,o,cut]=pick(d);const x=raw.replace(/<think>[\s\S]*?(<\/think>|$)/gi,'').replace(/```/g,'').trim();
  if(cut&&(t==='anthropic'||t==='gemini')&&(x.split('\n').filter(l=>l.trim()).length<2||!/[\u3400-\u9fff]/.test(x)))throw{st:0,msg:'jawaban terpotong (token habis, model mungkin berpikir panjang), coba model lain'};
 if(!x)throw{st:0,msg:'respons kosong'+((t==='anthropic'||t==='gemini')?'':' (model kemungkinan berpikir panjang dan kehabisan token; isi Parameter tambahan untuk mematikan reasoning atau pakai model non-reasoning)')};
 if(!/[\u3400-\u9fff]/.test(x))throw{st:0,msg:'jawaban tanpa Hanzi (model reasoning atau terpotong), coba model lain'};
 return{x,i,o}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function callR(s,system,text,max){
 for(let i=0;;i++){try{return await call(s,system,text,max)}
  catch(e){if(i<2&&(e.st>=500||/high demand|overloaded|unavailable/i.test(e.msg))){$('go').textContent='Server sibuk, mencoba lagi…';await sleep(1500*(i+1));continue}throw e}}}
async function api(system,text,max){
 const ok=slots.filter(s=>s.k);
 if(!ok.length){$('cfg').click();throw new Error('Isi API key di Pengaturan')}
 let live=ok.filter(s=>(cool[s.id]||0)<Date.now());
 if(!live.length)live=ok;
 const errs=[];
 for(const s of live){
  try{const r=await callR(s,system,text,max);meta(r,nm(s));return r.x}
  catch(e){errs.push(nm(s)+': '+String(e.msg).slice(0,90));
   if(e.st===429)cool[s.id]=Date.now()+(/day|daily|harian/i.test(e.msg)?36e5:6e4)}}
 throw new Error(errs.join(' | '))}
const nv=()=>+(L.getItem('tr_nv')||1),mp=()=>L.getItem('tr_mp')==='1';
function sys1(n){const ai=pm()==='ai',base=ai?S1A:S1;if(n<2)return base;
 return base.split(' Balas persis')[0]+' Beri '+n+' variasi terjemahan yang berbeda nuansa (mis. netral, santai, tegas), semuanya wajib gaya Taiwan dan alami. Tiap variasi '+(ai?'3 baris: Hanzi / Pinyin / Arti':'2 baris: Hanzi / Arti')+' Indonesia (tambahkan nuansa singkat dalam kurung). Pisahkan variasi dengan baris berisi ---. Tanpa tambahan.'}
async function runOne(s,system,text,max){
 try{const r=await callR(s,system,text,max);meta(r,nm(s));return{l:nm(s),x:r.x}}
 catch(e){if(e.st===429)cool[s.id]=Date.now()+(/day|daily|harian/i.test(e.msg)?36e5:6e4);return{l:nm(s),err:String(e.msg).slice(0,90)}}}
async function apiMulti(system,text,max,n){
 const ok=slots.filter(s=>s.k);if(!ok.length){$('cfg').click();throw new Error('Isi API key di Pengaturan')}
 let live=ok.filter(s=>(cool[s.id]||0)<Date.now());if(live.length<n)live=ok;
 const pool=[...live],res=await Promise.all(pool.splice(0,n).map(s=>runOne(s,system,text,max))),out=[];
 for(let x of res){while(x.err&&pool.length)x=await runOne(pool.shift(),system,text,max);out.push(x)}

function drawSlots(){const sl=$('sl');sl.textContent='';
 slots.forEach((s,i)=>{const d=document.createElement('div');d.className='slot';d.dataset.i=i;
  d.innerHTML='<div class="sh"><b></b><select data-f="t">'+Object.keys(T).map(k=>'<option value="'+k+'"'+(k===s.t?' selected':'')+'>'+T[k].n+'</option>').join('')+'</select><button type="button" data-a="up">↑</button><button type="button" data-a="del">Hapus</button></div><input type="text" data-f="n" placeholder="Nama (opsional)"><input type="password" data-f="k" placeholder="API key" autocomplete="off"><input type="text" data-f="m" placeholder="Model"><input type="text" data-f="b" placeholder="Base URL"><input type="text" data-f="x" placeholder="Parameter tambahan JSON, mis. {&quot;thinking&quot;:{&quot;type&quot;:&quot;disabled&quot;}}">';
  d.querySelector('b').textContent=lbl(i);for(const f of ['n','k','m','b','x'])d.querySelector('[data-f='+f+']').value=s[f]||'';
  if(s.t==='anthropic'||s.t==='gemini'){d.querySelector('[data-f=b]').style.display='none';d.querySelector('[data-f=x]').style.display='none'}
  sl.append(d)})}
$('sl').addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const s=slots[e.target.closest('.slot').dataset.i];
 if(f==='t'){s.t=e.target.value;s.m=T[s.t].m;s.b=T[s.t].b||'';drawSlots()}else{s[f]=e.target.value.trim();if(f==='n')e.target.closest('.slot').querySelector('b').textContent=lbl(+e.target.closest('.slot').dataset.i)}saveSlots();for(const k in cool)delete cool[k]});
function dmsg(t){const m=$('dmsg');m.textContent=t;clearTimeout(dmsg.t);dmsg.t=setTimeout(()=>m.textContent='',3000)}
$('sl').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;const i=+e.target.closest('.slot').dataset.i;
 if(a==='del'){if(!confirm('Hapus penyedia '+lbl(i)+'?'))return;slots.splice(i,1);dmsg('Penyedia dihapus')}
 else if(i>0){[slots[i-1],slots[i]]=[slots[i],slots[i-1]];dmsg('Urutan diubah')}
 for(const k in cool)delete cool[k];saveSlots();drawSlots()});
$('add').onclick=()=>{slots.push({id:rid(),t:'gemini',k:'',m:T.gemini.m,b:''});saveSlots();drawSlots();dmsg('Penyedia ditambahkan, isi API key-nya')};
$('cfg').onclick=()=>{if(!slots.length)slots.push({id:rid(),t:'gemini',k:'',m:T.gemini.m,b:''});drawSlots();$('dlg').showModal();document.activeElement&&document.activeElement.blur()};
let tin=0,tout=0;function meta(r,n){tin+=r.i;tout+=r.o;$('meta').textContent=`Via ${n} · permintaan ini: ${r.i} masuk, ${r.o} keluar · total sesi: ${tin}/${tout}`}
function save(){const k=Object.keys(cache);if(k.length>300)delete cache[k[0]];L.setItem('tr_c3',JSON.stringify(cache))}
const ICC='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',ICK='<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',ICS='<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function parse(x){const ai=pm()==='ai',n=ai?3:2;
 return x.split(/^\s*-{3,}\s*$/m).map(b=>b.split('\n').map(l=>l.trim()).filter(Boolean)).filter(b=>b.length).map(ls=>{
  if(ls.length>n+3)ls=ls.slice(-n);const h=ls[0]||'',u=ai&&ls.length>=3;
  return{h,p:u?ls[1]:(py(h)||'(pinyin belum termuat, buka sekali dengan internet)'),a:u?ls.slice(2).join(' '):(ls[1]||'')}})}
function mkCard(v,lab){const d=document.createElement('div');d.className='res';
 d.innerHTML=(lab?'<div class="lb"></div>':'')+'<div class="hz"></div><div class="pn"></div><div class="ar"></div><div class="act"><button class="ic sp" aria-label="Dengarkan" title="Dengarkan">'+ICS+'</button><button class="ex">Jelaskan</button><button class="ic cp" aria-label="Salin Hanzi" title="Salin Hanzi">'+ICC+'</button></div><pre></pre>';
 if(lab)d.querySelector('.lb').textContent=lab;
 d.querySelector('.hz').textContent=v.h;d.querySelector('.pn').textContent=v.p;d.querySelector('.ar').textContent=v.a;
 const c={h:v.h,el:d,ex:d.querySelector('.ex'),pre:d.querySelector('pre')},cp=d.querySelector('.cp');
 d.querySelector('.sp').onclick=()=>speak(v.h);
 cp.onclick=async()=>{try{await navigator.clipboard.writeText(v.h);cp.innerHTML=ICK;setTimeout(()=>cp.innerHTML=ICC,1200)}catch(e){}};
 c.ex.onclick=()=>explain(c);return c}
function renderAll(rs){const o=$('out');o.textContent='';let first=null;
